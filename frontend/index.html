<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flood Risk Map of IKN</title>

<style>

body{
margin:0;
padding:0;
}

header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #fff;
    padding: 10px 20px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    z-index: 1000;
    display: flex;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #007bff;
    margin-right: 20px;
}

header h1 {
    margin: 0;
    font-size: 20px;
}

#map{
position:absolute;
top:80px;
bottom:0;
width:100%;
}

#menu{
position:absolute;
background:white;
padding:10px;
top:10px;
left:10px;
z-index:1;
font-size:14px;
}

#legend{
position:absolute;
bottom:20px;
left:10px;
padding:10px;
font-size: 13px;
z-index:1;
}

#legend>div:first-child{
font-size: 14px;
}

</style>

</head>

<body>

<header>
    <div class="logo">OIKN</div>
    <h1>Flood Risk Map of IKN</h1>
</header>

<div id="menu">
<b>Layer</b><br>


<input type="checkbox" id="osm_geoserver" checked> Basemap<br>
<input type="checkbox" id="delineasi_ikn" checked> IKN Boundary<br>
<input type="checkbox" id="sungai" checked> Rivers<br>
<input type="checkbox" id="buffer100" checked> High Flood Risk (100 m)<br>
<input type="checkbox" id="buffer300" checked> Moderate Flood Risk (300 m)

</div>

<div id="legend">
    <div>
        <b>Legend</b><br><br>
    </div>

    <b>Flood Risk Zones</b><br>
    <div style="display: flex; align-items: center;">
        <img src="http://127.0.0.1:8081/geoserver/ikn/wms?service=WMS&request=GetLegendGraphic&layer=ikn:buffer_banjir_100m_IKN&format=image/png" alt="Buffer Banjir IKN 100m">
        High Flood Risk (≤100 m from River)<br>
    </div>
    <div style="display: flex; align-items: center;">
        <img src="http://127.0.0.1:8081/geoserver/ikn/wms?service=WMS&request=GetLegendGraphic&layer=ikn:buffer_banjir_300m_IKN&format=image/png" alt="Buffer Banjir IKN 100m">
        Moderate Flood Risk (100–300 m from River)<br>
    </div>

    <br><b>Hydrology</b><br>
    <div style="display: flex; align-items: center;">
        <img src="http://127.0.0.1:8081/geoserver/ikn/wms?service=WMS&request=GetLegendGraphic&layer=ikn:river_IKN&format=image/png" alt="Sungai IKN">
        River<br>
    </div>
    <img src="http://127.0.0.1:8081/geoserver/ikn/wms?service=WMS&request=GetLegendGraphic&layer=ikn:IKN_osm&format=image/png" alt="OSM IKN">
</div>

<div id="map"></div>
<script type="module" src="/src/main.js"></script>


</body>
</html>
